<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Zeit &amp; Notizen</title>
<meta name="theme-color" content="#EDEDF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zeit &amp; Notizen">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ===== HOME ===== -->
  <section class="screen" id="screen-home" data-screen="home">
    <header class="topbar">
      <div>
        <p class="greeting" id="greeting">Guten Morgen</p>
        <p class="date" id="today-date">Montag, 03.08.26</p>
      </div>
      <p class="credit">Programmiert von<br>Tobias</p>
    </header>

    <div class="status-card">
      <div>
        <p class="status-label">Status</p>
        <p class="status-value" id="status-value">Nicht eingestempelt</p>
      </div>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    </div>

    <button class="big-btn big-btn--blue" id="btn-clockin">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Einstempeln
    </button>

    <button class="big-btn big-btn--red" id="btn-clockout">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      Ausstempeln
    </button>

    <div class="today-summary" id="today-summary">
      <p class="summary-label">Heute</p>
      <p class="summary-empty">Noch keine Einträge</p>
    </div>
  </section>

  <!-- ===== NOTES LIST ===== -->
  <section class="screen" id="screen-notes" data-screen="notes">
    <header class="topbar topbar--simple">
      <p class="page-title">Notizen</p>
    </header>

    <button class="pill-btn pill-btn--filled" id="btn-note-open">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h12l4 4v12H4z"/><path d="M14 4v5h5"/></svg>
      <span id="note-btn-label">Neue Notiz</span>
    </button>

    <button class="pill-btn" id="btn-history-open">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Verlauf
    </button>

    <p class="section-label">Verlauf</p>
    <div class="list" id="notes-history-list">
      <p class="list-empty">Noch keine vergangenen Notizen</p>
    </div>
  </section>

  <!-- ===== NOTE EDITOR ===== -->
  <section class="screen" id="screen-note-editor" data-screen="note-editor">
    <header class="topbar topbar--simple">
      <button class="back-btn" data-back="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <p class="page-title" id="note-editor-title">Neue Notiz</p>
      <span class="spacer"></span>
    </header>
    <textarea id="note-textarea" class="note-textarea" placeholder="Schreib deine Notiz für heute…"></textarea>
    <button class="pill-btn pill-btn--filled" id="btn-note-save">Speichern</button>
  </section>

  <!-- ===== NOTE VIEW (read-only, from history) ===== -->
  <section class="screen" id="screen-note-view" data-screen="note-view">
    <header class="topbar topbar--simple">
      <button class="back-btn" data-back="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <p class="page-title" id="note-view-title">03.08.26</p>
      <span class="spacer"></span>
    </header>
    <div class="note-readonly" id="note-view-content"></div>
  </section>

  <!-- ===== TIME STAMPS ===== -->
  <section class="screen" id="screen-times" data-screen="times">
    <header class="topbar topbar--simple">
      <p class="page-title">Zeiterfassung</p>
    </header>

    <select id="filter-range" class="filter-select">
      <option value="week">Diese Woche</option>
      <option value="month">Dieser Monat</option>
      <option value="all">Alle</option>
    </select>

    <div class="list" id="times-list">
      <p class="list-empty">Noch keine Zeiteinträge</p>
    </div>
  </section>

  <!-- ===== BOTTOM SHEET: reason ===== -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="reason-sheet">
    <div class="sheet-handle"></div>
    <p class="sheet-title" id="sheet-title">Einstempeln um 9:32</p>
    <p class="sheet-label">Grund (Pflichtfeld)</p>
    <textarea id="reason-input" class="sheet-textarea" placeholder="z.B. Anfahrt zur Arbeit"></textarea>
    <p class="sheet-error" id="sheet-error">Bitte einen Grund angeben.</p>
    <button class="pill-btn pill-btn--filled" id="sheet-confirm">Bestätigen</button>
  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="tabbar">
    <button class="tab" data-target="notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h12l4 4v12H4z"/><path d="M14 4v5h5"/></svg>
      <span>Notizen</span>
    </button>
    <button class="tab is-active" data-target="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-target="times">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
      <span>Zeiten</span>
    </button>
  </nav>

</div>

<script src="app.js"></script>
</body>
</html>
